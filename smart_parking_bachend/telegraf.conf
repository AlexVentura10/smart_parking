[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  debug = true
  quiet = false
  hostname = ""
  omit_hostname = false

# Entrada: O Telegraf escuta o broker MQTT onde o ESP32 publica
[[inputs.mqtt_consumer]]
  servers = ["tcp://broker.hivemq.com:1883"]
  topics = [
    "smartparking/vagas"
  ]
  data_format = "json"
  # O Telegraf vai mapear automaticamente as chaves do JSON como campos no InfluxDB
  # Exemplo de payload recebido: {"node_id":"esp32_s3_01","vaga_01":0,"confianca":0.95}
  tag_keys = [
    "node_id"
  ]

# Saída: Grava os dados coletados no InfluxDB v2
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "my-super-secret-auth-token"
  organization = "smart_parking_org"
  bucket = "vagas_bucket"